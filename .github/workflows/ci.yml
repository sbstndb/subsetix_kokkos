name: CI

on:
  pull_request:
    branches: ['**']

jobs:
  # Main CI job - tests Serial and OpenMP backends with GCC
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        backend: [serial, openmp]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-gcc-${{ matrix.backend }}

      - name: Cache Kokkos and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            build-${{ matrix.backend }}
          key: ${{ runner.os }}-build-${{ matrix.backend }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ matrix.backend }}-

      - name: Configure CMake
        run: cmake --preset ${{ matrix.backend }}

      - name: Build
        run: cmake --build ${{ format('build-{0}', matrix.backend) }} --parallel $(nproc)

      - name: Run tests
        working-directory: ${{ format('build-{0}', matrix.backend) }}
        run: ctest --output-on-failure

  # Debug build check with sanitizers
  debug-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-debug

      - name: Cache Kokkos and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            build-serial-asan
          key: ${{ runner.os }}-build-serial-asan-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            ${{ runner.os }}-build-serial-asan-

      - name: Configure CMake with sanitizers
        run: cmake --preset serial-asan

      - name: Build
        run: cmake --build build-serial-asan --parallel $(nproc)

      - name: Run tests
        working-directory: build-serial-asan
        run: ctest --output-on-failure

  # Optional: Clang compilation check (Serial only, non-blocking)
  # Note: Clang on GitHub Actions lacks OpenMP support
  clang-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Clang and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache clang

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-clang-serial

      - name: Cache Kokkos and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            build-clang-serial
          key: ${{ runner.os }}-build-clang-serial-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-build-clang-serial-

      - name: Configure with Clang (Serial only)
        run: |
          export CC=clang
          export CXX=clang++
          cmake -B build-clang-serial \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSUBSETIX_KOKKOS_OPENMP=OFF \
            -DSUBSETIX_USE_MPI=OFF

      - name: Build with Clang
        run: cmake --build build-clang-serial --parallel $(nproc)

      - name: Test with Clang
        working-directory: build-clang-serial
        run: ctest --output-on-failure

  # Code coverage job
  coverage:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build lcov

      - name: Configure with coverage
        run: cmake --preset coverage

      - name: Build
        run: cmake --build build-coverage --parallel $(nproc)

      - name: Run tests
        working-directory: build-coverage
        run: ctest --output-on-failure --parallel $(nproc)

      - name: Generate coverage report
        run: |
          lcov --capture --directory build-coverage \
            --base-directory ${{ github.workspace }} \
            --output-file coverage.info \
            --rc lcov_branch_coverage=1

          lcov --remove coverage.info \
            "*/build-coverage/*" \
            "*/tests/*" \
            "*/benchmarks/*" \
            "*/examples/*" \
            "*/_deps/*" \
            "*/.cache/*" \
            "*/googletest/*" \
            "*/benchmark/*" \
            "*/kokkos/*" \
            --output-file coverage_filtered.info \
            --rc lcov_branch_coverage=1

          genhtml coverage_filtered.info \
            --output-directory coverage_html \
            --title "Subsetix Kokkos Coverage" \
            --legend \
            --show-details \
            --branch-coverage

      - name: Coverage summary
        run: lcov --summary coverage_filtered.info

      - name: Check coverage threshold
        run: |
          COVERAGE=$(lcov --summary coverage_filtered.info | grep "lines" | grep -oP '\d+\.\d+(?=%)')
          echo "Coverage: $COVERAGE%"
          THRESHOLD=70
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below threshold $THRESHOLD%"
            exit 1
          else
            echo "✅ Coverage $COVERAGE% meets threshold $THRESHOLD%"
          fi

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_html/
          retention-days: 30

  # clang-tidy static analysis
  clang-tidy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-tidy

      - name: Configure for clang-tidy
        run: |
          export CC=clang
          export CXX=clang++
          cmake -B build-tidy \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DSUBSETIX_KOKKOS_OPENMP=OFF \
            -DSUBSETIX_USE_MPI=OFF

      - name: Run clang-tidy
        run: |
          cd build-tidy
          run-clang-tidy -p . \
            -header-filter='.*' \
            'include/.*' \
            || true

      - name: Upload clang-tidy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-results
          path: build-tidy/clang-tidy-log.txt
          retention-days: 7
