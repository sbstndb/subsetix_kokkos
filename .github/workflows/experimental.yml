name: Experimental CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  experimental-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache

      - name: Configure with experimental enabled
        run: |
          cmake --preset serial \
            -DSUBSETIX_ENABLE_EXPERIMENTAL=ON \
            -DBUILD_TESTING=ON \
            -DSUBSETIX_BUILD_STABLE_LIBS=OFF \
            -DSUBSETIX_BUILD_STABLE_TESTS=OFF \
            -DSUBSETIX_BUILD_STABLE_BENCHMARKS=OFF

      - name: Build
        run: cmake --build build-serial --parallel $(nproc)

      - name: Run experimental tests
        working-directory: build-serial
        run: ctest --output-on-failure

      # Note: Benchmarks are skipped in CI due to segfault issues in GitHub Actions environment
      # Benchmarks work locally but fail in CI environment - to be investigated later
