name: Experimental CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  experimental-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache

      - name: Configure with experimental enabled
        run: |
          cmake --preset serial \
            -DSUBSETIX_ENABLE_EXPERIMENTAL=ON \
            -DBUILD_EXAMPLES=OFF \
            -DSUBSETIX_BUILD_STABLE_LIBS=OFF \
            -DSUBSETIX_BUILD_STABLE_TESTS=OFF \
            -DSUBSETIX_BUILD_STABLE_BENCHMARKS=OFF

      - name: Build
        run: cmake --build build-serial --parallel $(nproc)

      - name: Run experimental tests
        working-directory: build-serial
        run: ctest --output-on-failure -R experimental

      - name: Run benchmarks (quick sanity check)
        working-directory: build-serial
        run: |
          ./benchmarks/experimental/set_algebra/unified_comparison_benchmark \
            --benchmark_min_time=0.001 \
            --benchmark_iterations=10
