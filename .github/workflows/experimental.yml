name: Playground CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  playground-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache

      - name: Configure with playground enabled
        run: cmake --preset playground-serial

      - name: Build
        run: cmake --build --preset playground-serial --parallel $(nproc)

      - name: Run playground tests
        run: ctest --preset playground-serial --output-on-failure

      - name: Run benchmarks (sanity check only)
        run: |
          ./build-playground-serial/playground/intersection/benchmarks/playground_intersection_comparison_benchmark \
            --kokkos-num-threads=1 \
            --benchmark_min_time=0.01s \
            --benchmark_repetitions=1 \
            --benchmark_filter="SmallConfig|MediumConfig"
          ./build-playground-serial/playground/intersection/benchmarks/playground_intersection_regular_benchmark \
            --kokkos-num-threads=1 \
            --benchmark_min_time=0.01s \
            --benchmark_repetitions=1 \
            --benchmark_filter="SmallConfig|MediumConfig"

      # Note: Filter matches SmallConfig and MediumConfig for fast but meaningful CI execution.

  # OpenMP backend check
  playground-openmp:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache

      - name: Configure with playground and OpenMP
        run: cmake --preset playground-openmp

      - name: Build
        run: cmake --build --preset playground-openmp --parallel $(nproc)

      - name: Run playground tests with OpenMP
        run: ctest --preset playground-openmp --output-on-failure

  # Debug build check with sanitizers
  playground-sanitizer:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache

      - name: Configure with playground and sanitizers
        run: cmake --preset playground-asan

      - name: Build
        run: cmake --build --preset playground-asan --parallel $(nproc)

      - name: Run playground tests with sanitizers
        run: ctest --preset playground-asan --output-on-failure
