name: Experimental CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  experimental-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache

      - name: Configure with experimental enabled
        run: |
          cmake --preset serial \
            -DSUBSETIX_ENABLE_EXPERIMENTAL=ON \
            -DBUILD_TESTING=ON \
            -DSUBSETIX_BUILD_STABLE_LIBS=OFF \
            -DSUBSETIX_BUILD_STABLE_TESTS=OFF \
            -DSUBSETIX_BUILD_STABLE_BENCHMARKS=OFF

      - name: Build
        run: cmake --build build-serial --parallel $(nproc)

      - name: Run experimental tests
        working-directory: build-serial
        run: ctest --output-on-failure

      - name: Run benchmarks (sanity check only)
        working-directory: build-serial
        run: |
          ./experimental/benchmarks/experimental_comparison_benchmark \
            --benchmark_min_time=0.01s \
            --benchmark_repetitions=1 \
            --benchmark_filter="SmallConfig"

      # Note: Filter matches only SmallConfig benchmarks for fast CI execution.

  # Debug build check with sanitizers
  experimental-sanitizer:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache

      - name: Configure with experimental and sanitizers
        run: |
          cmake --preset serial-asan \
            -DSUBSETIX_ENABLE_EXPERIMENTAL=ON \
            -DSUBSETIX_BUILD_STABLE_LIBS=OFF \
            -DSUBSETIX_BUILD_STABLE_TESTS=OFF \
            -DSUBSETIX_BUILD_STABLE_BENCHMARKS=OFF

      - name: Build
        run: cmake --build build-serial-asan --parallel $(nproc)

      - name: Run experimental tests with sanitizers
        working-directory: build-serial-asan
        run: ctest --output-on-failure
